name: update-config

on:
  schedule:
    # UTC 周日 20:00 = 北京时间周一 04:00，每周执行一次
    - cron: '0 20 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-config
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 公开输出仓。默认 fans163/6，可用仓库变量 PUBLISH_REPO 覆盖。
      TVBOX_PUBLIC_REPO: ${{ vars.PUBLISH_REPO || 'fans163/6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 先同步远端（避免非快进推送被拒）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true

      - name: 检测上游并生成多仓配置
        run: python3 update.py

      - name: 提交变化
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "auto update $(date -u +%Y-%m-%d_%H:%M)"
            git push --force origin main
          fi

      - name: 发布到公开仓
        env:
          PUBLISH_REPO: ${{ vars.PUBLISH_REPO || 'fans163/6' }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_REPO" ] || [ -z "$PUBLISH_TOKEN" ]; then
            echo "未配置 PUBLISH_REPO / PUBLISH_TOKEN，跳过发布"
            exit 0
          fi
          rm -rf /tmp/publish && mkdir -p /tmp/publish/sources
          cp tvbox.json status.md /tmp/publish/
          cp sources/*.json /tmp/publish/sources/
          cd /tmp/publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "publish $(date -u +%Y-%m-%d_%H:%M)"
          git push -q --force "https://x-access-token:${PUBLISH_TOKEN}@github.com/${PUBLISH_REPO}.git" HEAD:main
